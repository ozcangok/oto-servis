# Oto Servis Yönetimi — electron-builder yapılandırması
#
# Bu dosya `scripts/prepare-app.cjs` tarafından `dist-app/` içine kopyalanır ve
# kurulum şu şekilde üretilir:
#   npm run dist:mac   (macOS .dmg)
#   npm run dist:win   (Windows .exe / NSIS)
#
# Notlar:
#  - Kurulumlar İMZASIZDIR (kod imzalama sertifikası yok). Windows SmartScreen /
#    macOS Gatekeeper ilk açılışta uyarı gösterir; "Yine de aç" ile çalışır.
#  - `asar: false`: gömülü API sunucusu ayrı bir Node süreci olarak `fork`
#    edildiği ve native modül (better-sqlite3) içerdiği için dosyalar diskte
#    tutulur (asar içinden fork edilemez).
#  - better-sqlite3, Electron ABI'si için otomatik yeniden derlenir (npmRebuild).

appId: com.otoservis.app
productName: Oto Servis Yonetimi
copyright: Copyright © Çınar Oto

# Kökte kurulu Electron sürümüyle birebir aynı olmalı (packages/electron devDependency).
# 22.3.27 = Windows 7 / 8 / 8.1 destekleyen SON Electron sürümü (23+ yalnızca Windows 10+).
electronVersion: 22.3.27

asar: false
npmRebuild: true

directories:
  output: ../dist-electron
  buildResources: build

# electron-updater'ın okuyacağı `app-update.yml` bu bilgilerle üretilir.
# Yayınlama GitHub Actions'ta `softprops/action-gh-release` ile yapılır;
# electron-builder yalnızca güncelleme meta dosyalarını (latest*.yml) üretir.
publish:
  provider: github
  owner: ozcangok
  repo: oto-servis
  releaseType: release

files:
  - "**/*"

mac:
  category: public.app-category.business
  # packages/electron/build/icon.icns (generate-icons.cjs ile üretilir)
  icon: icon.icns
  target:
    # .dmg = elle kurulum; .zip = electron-updater (Squirrel.Mac) güncellemesi
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  artifactName: "Oto-Servis-${version}-${arch}.${ext}"
  # İmzasız dağıtım. Not: macOS otomatik güncellemesi için imzalı uygulama
  # gerekir; imzasız sürümde .dmg indirme yedeği kullanılır.
  identity: null

dmg:
  title: "Oto Servis Yönetimi"
  # Arka plan GÖRÜNTÜSÜ kullanılmıyor: dmg-builder'ın gömülü mac_alias
  # sürümü, APFS'te 32 bit'i aşan dosya kimliklerini serileştiremiyor ve
  # "struct.error: 'I' format requires 0 <= number <= 4294967295" ile
  # patlıyor. Düz renk arka plan bu kod yolunu tamamen atlar.
  backgroundColor: "#ffffff"
  artifactName: "Oto-Servis-${version}-${arch}.${ext}"

win:
  # packages/electron/build/icon.ico (generate-icons.cjs ile üretilir)
  icon: icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "Oto-Servis-${version}-kurulum.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Oto Servis
  artifactName: "Oto-Servis-${version}-kurulum.${ext}"
